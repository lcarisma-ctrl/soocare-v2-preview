<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F7FA" />
    <title>수케어(SOOCARE) - 재활센터 통합 관리</title>
    <script>
        /* 테마 부트스트랩 — 번들이 뜨기 전에 테마를 정해 깜빡임(FOUC)을 막는다.
           저장값은 light | dark | system. 없으면 system(OS 설정). */
        (function () {
            try {
                var mode = localStorage.getItem('soocare_theme') || 'system';
                var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', dark ? '#0B0F14' : '#F5F7FA');
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        /* 번들 로드 전 첫 화면 — 앱의 부팅 화면과 같은 톤으로 깜빡임을 줄인다 */
        html, body { margin: 0; background: #F5F7FA; }
        html[data-theme='dark'], html[data-theme='dark'] body { background: #0B0F14; }
        .initial-loader {
            position: fixed;
            inset: 0;
            background: #F5F7FA;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 9999;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
        }
        html[data-theme='dark'] .initial-loader { background: #0B0F14; }
        .initial-loader .mark {
            width: 46px; height: 46px; border-radius: 13px;
            background: #1E6FD9; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 800;
            box-shadow: 0 6px 18px rgba(30,111,217,.32);
        }
        .initial-loader p { margin: 0; font-size: 13px; font-weight: 700; color: #33414F; }
        html[data-theme='dark'] .initial-loader p { color: #CBD5E0; }
        .initial-loader .bar { width: 120px; height: 3px; border-radius: 999px; background: #E5E9EE; overflow: hidden; }
        html[data-theme='dark'] .initial-loader .bar { background: #232C36; }
        .initial-loader .bar > i { display: block; width: 45%; height: 100%; border-radius: 999px; background: #3182F6; animation: load 1.2s ease-in-out infinite; }
        @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(230%); } }
        @media (prefers-reduced-motion: reduce) { .initial-loader .bar > i { animation: none; width: 100%; } }
    </style>
  <script type="module" crossorigin src="./assets/index-Cx4VNbzf.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DZtxwa1P.css">
</head>
<body>
    <div id="root">
        <div class="initial-loader">
            <div class="mark">수</div>
            <p>수케어 통합관리</p>
            <div class="bar"><i></i></div>
        </div>
    </div>
</body>
</html>
