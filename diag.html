<!DOCTYPE html><html><head><meta charset="utf-8"><title>diag</title></head>
<body>
<div id="root"></div>
<pre id="out"></pre>
<script>
window.addEventListener('error', function(e){
  document.getElementById('out').textContent += 'ERROR: ' + (e.message||'') + ' @ ' + (e.filename||'') + ':' + (e.lineno||'') + '\n' + ((e.error&&e.error.stack)||'') + '\n\n';
  if (e.error) document.getElementById('out').textContent += String(e.error) + '\n';
}, true);
window.addEventListener('unhandledrejection', function(e){
  document.getElementById('out').textContent += 'REJECTION: ' + ((e.reason && (e.reason.stack||e.reason.message)) || e.reason) + '\n\n';
});
</script>
<script type="module" src="./assets/index-D-XHm5pZ.js"></script>
</body></html>
